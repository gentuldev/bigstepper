<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — BRAQZ!</title>
  <link rel="icon" href="assets/logo.png" />

  <!-- Fonts: Poppins + Baloo 2 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* keep config simple; no animation classes needed now */
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Poppins','ui-sans-serif','system-ui'] },
        extend: {
          colors: { olive:'#3a4a2b', sage:'#c9d1b4', neon:'#8cff6a' },
          borderRadius: { pill:'9999px' },
          boxShadow: { soft:'0 10px 30px rgba(0,0,0,.08)' }
        }
      }
    }
  </script>

  <style>
    body{font-family:Poppins,system-ui,sans-serif}
    .brand{font-family:'Baloo 2',system-ui,sans-serif;letter-spacing:.5px}
  </style>
</head>
<body class="bg-sage text-olive">

  <!-- ===== Header (logo only, left-aligned) ===== -->
<header class="sticky top-0 z-50 border-b shadow-[0_2px_10px_rgba(0,0,0,0.05)] bg-gradient-to-r from-[#cbd3b9] via-white/80 to-white backdrop-blur relative">
  <div class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-between gap-3">
    
    <!-- Brand: feet logo only (bigger) -->
    <a href="index.html" class="flex items-center min-w-0">
      <img src="assets/logo-feet.png" alt="BRAQZ logo"
           class="h-12 sm:h-14 w-auto object-contain drop-shadow-[0_1px_2px_rgba(0,0,0,0.2)]">
    </a>

    <!-- Hamburger -->
    <button id="menuBtn" aria-label="Open menu"
            class="inline-flex items-center justify-center w-11 h-11 rounded-xl border text-[#111]/80 hover:bg-[#111] hover:text-white transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
      </svg>
    </button>
  </div>

  <!-- Slide-down mobile menu -->
  <nav id="mobileMenu"
       class="hidden absolute top-full inset-x-0 z-[60] bg-white border-b shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 grid gap-3 text-sm">
      <a class="py-2" href="shop.html">Shop</a>
      <div class="grid grid-cols-3 gap-2 text-xs text-black/70">
        <a href="shop.html#Crocs"  class="rounded-full border px-3 py-2 text-center">Crocs</a>
        <a href="shop.html#Clogs"  class="rounded-full border px-3 py-2 text-center">Clogs</a>
        <a href="shop.html#Slides" class="rounded-full border px-3 py-2 text-center">Slides</a>
      </div>
      <a class="py-2" href="about.html">About</a>
      <a class="py-2" href="faq.html">FAQ</a>
      <a class="py-2" href="contact.html">Contact</a>
    </div>
  </nav>
</header>

  <!-- ===== Main ===== -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-end justify-between mb-6">
      <div>
        <h1 class="text-2xl font-extrabold brand">Shop</h1>
        <p class="text-sm text-olive/70">Filter by category and explore.</p>
      </div>
      <div class="flex gap-2 text-sm">
        <button class="rounded-pill border px-3 py-2 bg-white">All</button>
        <button class="rounded-pill border px-3 py-2 bg-white">Crocs</button>
        <button class="rounded-pill border px-3 py-2 bg-white">Clogs</button>
        <button class="rounded-pill border px-3 py-2 bg-white">Slides</button>
      </div>
    </div>

    <!-- Design-only placeholders for now -->
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <article class="bg-white border rounded-2xl overflow-hidden shadow-soft">
        <div class="h-56 bg-olive/20"></div>
        <div class="p-4 space-y-2">
          <h3 class="font-semibold">Product Name</h3>
          <p class="text-sm text-olive/70">Category</p>
          <a class="inline-block mt-2 rounded-2xl bg-olive text-white px-3 py-2 text-sm">View</a>
        </div>
      </article>
      <article class="bg-white border rounded-2xl overflow-hidden shadow-soft">
        <div class="h-56 bg-olive/20"></div>
        <div class="p-4 space-y-2">
          <h3 class="font-semibold">Product Name</h3>
          <p class="text-sm text-olive/70">Category</p>
          <a class="inline-block mt-2 rounded-2xl bg-olive text-white px-3 py-2 text-sm">View</a>
        </div>
      </article>
      <article class="bg-white border rounded-2xl overflow-hidden shadow-soft">
        <div class="h-56 bg-olive/20"></div>
        <div class="p-4 space-y-2">
          <h3 class="font-semibold">Product Name</h3>
          <p class="text-sm text-olive/70">Category</p>
          <a class="inline-block mt-2 rounded-2xl bg-olive text-white px-3 py-2 text-sm">View</a>
        </div>
      </article>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="border-t bg-white">
    <div class="max-w-6xl mx-auto px-4 py-8 text-sm flex items-center justify-between">
      <div>© <span id="year"></span> BRAQZ. All rights reserved.</div>
      <a href="#" class="underline">Back to top</a>
    </div>
  </footer>

  <!-- Floating WhatsApp -->
  <a id="floatWa" href="#" target="_blank"
     class="fixed bottom-5 right-5 rounded-pill bg-neon text-olive px-5 py-3 shadow-soft text-sm font-semibold transition duration-300">
     Chat on WhatsApp
  </a>

  <!-- ===== Scripts ===== -->
  <script src="assets/app.js"></script>

  <!-- Fallback: runs ONLY if app.js didn’t load or failed -->
  <script>
    (function(){
      if (window.BRAQZ_APP_LOADED) return; // app.js ran; skip fallback

      // WhatsApp fallback
      var floater = document.getElementById('floatWa');
      if (floater) {
        var num = '2349136627644';
        var link = 'https://wa.me/' + num + '?text=' + encodeURIComponent('Hello BRAQZ!');
        floater.setAttribute('href', link);

        var lastY = window.scrollY;
        window.addEventListener('scroll', function(){
          var y = window.scrollY;
          if (y > lastY + 5) {
            floater.style.transform = 'translateY(96px) scale(0.95)';
            floater.style.opacity = '0';
          } else if (y < lastY - 5) {
            floater.style.transform = '';
            floater.style.opacity = '';
          }
          lastY = y;
        }, {passive:true});
      }

      // SIMPLE menu toggle (no animations required)
      var btn  = document.getElementById('menuBtn');
      var menu = document.getElementById('mobileMenu');
      if (btn && menu) {
        btn.addEventListener('click', function(){
          menu.classList.toggle('hidden');
        });
      }

      console.warn('BRAQZ fallback active on this page (app.js not detected).');
    })();
  </script>
</body>
</html>
