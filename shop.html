<!doctype html>
<html lang="en">

<body class="bg-sage text-olive">
  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Design-only placeholders for now -->
      <article class="bg-white border rounded-2xl overflow-hidden shadow-soft">
        <div class="h-56 bg-olive/20"></div>

          <h3 class="font-semibold">Product Name</h3>
          <p class="text-sm text-olive/70">Category</p>

      <article class="bg-white border rounded-2xl overflow-hidden shadow-soft">

        <div class="p-4 space-y-2">

          <p class="text-sm text-olive/70">Category</p>
          <a class="inline-block mt-2 rounded-2xl bg-olive text-white px-3 py-2 text-sm">View</a>
        </div>
      </article>
    </div>

  <footer class="border-t bg-white">

      <div>© <span id="year"></span> BRAQZ. All rights reserved.</div>
      <a href="#" class="underline">Back to top</a>

  <a id="floatWa" href="#" target="_blank" class="fixed bottom-5 right-5 rounded-pill bg-neon text-olive px-5 py-3 shadow-soft text-sm font-semibold">Chat on WhatsApp</a>
